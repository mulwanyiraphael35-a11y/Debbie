<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SecureChat — E2E Encrypted Messaging</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #4f8cff;
    --bubble-me: #4f8cff; --bubble-them: #21262d;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); height:100vh; }
  #login { display:flex; align-items:center; justify-content:center; height:100vh; flex-direction:column; gap:12px; }
  #login input { padding:10px 14px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:15px; width:260px; }
  #login button { padding:10px 20px; border-radius:8px; border:none; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  #login p.hint { color:var(--muted); font-size:13px; max-width:320px; text-align:center; }
  #login-error { color:#f85149; font-size:13px; max-width:320px; text-align:center; display:none; }

  #app { display:none; height:100vh; grid-template-columns: 300px 1fr; grid-template-rows: auto 1fr; }
  #app.active { display:grid; }

  #stories-bar { grid-column: 1 / 3; display:flex; gap:14px; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--border); overflow-x:auto; align-items:center; }
  .story-avatar { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; flex-shrink:0; }
  .story-ring { width:52px; height:52px; border-radius:50%; border:2px solid var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; background:var(--bg); }
  .story-ring.add { border-style:dashed; color:var(--accent); font-size:22px; }
  .story-label { font-size:11px; color:var(--muted); max-width:56px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  #sidebar { background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; }
  #sidebar h3 { padding:14px 16px 6px; margin:0; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .contact { display:flex; align-items:center; gap:10px; padding:10px 16px; cursor:pointer; }
  .contact:hover, .contact.active { background:#1c2229; }
  .avatar-wrap { position:relative; flex-shrink:0; }
  .avatar { width:36px; height:36px; border-radius:50%; background:#30363d; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; }
  .dot { position:absolute; width:10px; height:10px; border-radius:50%; border:2px solid var(--panel); right:-1px; bottom:-1px; background:#555; }
  .dot.online { background:#3fb950; }
  .contact-meta { display:flex; flex-direction:column; }
  .contact-name { font-size:14px; }
  .contact-sub { font-size:11px; color:var(--muted); }

  #chat { display:flex; flex-direction:column; height:100%; overflow:hidden; }
  #chat-header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  #chat-header-text { display:flex; flex-direction:column; }
  #chat-title { font-weight:600; }
  #chat-substatus { font-size:12px; color:var(--muted); height:16px; }
  #chat-substatus.typing { color:var(--accent); }
  #lock { color:#3fb950; font-size:12px; font-weight:500; display:flex; align-items:center; gap:4px; }
  #messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
  .bubble-row { display:flex; }
  .bubble-row.me { justify-content:flex-end; }
  .bubble { max-width:60%; padding:9px 13px; border-radius:14px; font-size:14px; line-height:1.4; }
  .bubble-row.me .bubble { background:var(--bubble-me); color:#fff; border-bottom-right-radius:4px; }
  .bubble-row.them .bubble { background:var(--bubble-them); border-bottom-left-radius:4px; }
  .bubble img { max-width:220px; border-radius:8px; display:block; }
  .bubble .ts { font-size:10px; opacity:.7; margin-top:4px; display:flex; gap:4px; align-items:center; justify-content:flex-end; }
  .ticks { font-size:12px; letter-spacing:-2px; }
  .ticks.read { color:#53bdeb; }
  #empty-state { margin:auto; color:var(--muted); text-align:center; font-size:14px; }

  #composer { display:flex; gap:8px; padding:14px; border-top:1px solid var(--border); }
  #composer input[type=text] { flex:1; padding:10px 14px; border-radius:20px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:14px; }
  #composer button, #composer label { background:var(--accent); color:#fff; border:none; border-radius:20px; padding:10px 16px; cursor:pointer; font-size:14px; display:flex; align-items:center; }
  #composer label.icon { background:var(--bubble-them); padding:10px 12px; }
  #composer input[type=file] { display:none; }

  #story-viewer { display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); align-items:center; justify-content:center; z-index:50; flex-direction:column; }
  #story-viewer img { max-width:90vw; max-height:80vh; border-radius:8px; }
  #story-viewer .caption { color:#fff; margin-top:14px; font-size:14px; }
  #story-viewer .close { position:absolute; top:20px; right:24px; color:#fff; font-size:28px; cursor:pointer; background:none; border:none; }
</style>
</head>
<body>

<div id="login">
  <h2>🔒 SecureChat</h2>
  <input id="username-input" type="text" placeholder="Choose a username" autocomplete="off" />
  <button id="login-btn">Enter</button>
  <p class="hint">An RSA keypair is generated in your browser on login. Your private key never leaves this device — the server only ever stores encrypted ciphertext.</p>
  <p id="login-error"></p>
</div>

<div id="app">
  <div id="stories-bar"></div>
  <div id="sidebar">
    <h3>Contacts</h3>
    <div id="contact-list"></div>
  </div>
  <div id="chat">
    <div id="chat-header">
      <div id="chat-header-text">
        <span id="chat-title">Select a contact</span>
        <span id="chat-substatus"></span>
      </div>
      <span id="lock" style="margin-left:auto;">🔒 End-to-end encrypted</span>
    </div>
    <div id="messages"><div id="empty-state">Pick a contact on the left to start an encrypted chat.</div></div>
    <div id="composer" style="display:none;">
      <label class="icon" for="image-input">📷</label>
      <input id="image-input" type="file" accept="image/*" />
      <input id="text-input" type="text" placeholder="Type a message…" />
      <button id="send-btn">Send</button>
    </div>
  </div>
</div>

<div id="story-viewer">
  <button class="close" id="story-close">×</button>
  <img id="story-img" />
  <div class="caption" id="story-caption"></div>
</div>

<script>
const API = ''; // same origin

// ---------------- Crypto helpers (Web Crypto API) ----------------
const enc = new TextEncoder();
const dec = new TextDecoder();

function buf2b64(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function b642buf(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr.buffer;
}

async function generateRsaKeyPair() {
  return crypto.subtle.generateKey(
    { name: 'RSA-OAEP', modulusLength: 2048, publicExponent: new Uint8Array([1,0,1]), hash: 'SHA-256' },
    true, ['encrypt', 'decrypt']
  );
}
async function exportPublicKey(key) {
  const raw = await crypto.subtle.exportKey('spki', key);
  return buf2b64(raw);
}
async function importPublicKey(b64) {
  return crypto.subtle.importKey('spki', b642buf(b64), { name: 'RSA-OAEP', hash: 'SHA-256' }, true, ['encrypt']);
}

async function generateAesKey() {
  return crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
}
async function exportAesKeyRaw(key) {
  return crypto.subtle.exportKey('raw', key);
}
async function importAesKeyRaw(raw) {
  return crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']);
}

// Encrypt `plaintext` (string) so ONLY recipientPublicKey's holder can read it.
// Returns { ciphertext(b64), iv(b64), encryptedKey(b64) }
async function encryptForRecipient(plaintext, recipientPublicKey) {
  const aesKey = await generateAesKey();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, enc.encode(plaintext));
  const rawAesKey = await exportAesKeyRaw(aesKey);
  const encryptedKey = await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, recipientPublicKey, rawAesKey);
  return { ciphertext: buf2b64(ciphertext), iv: buf2b64(iv), encryptedKey: buf2b64(encryptedKey) };
}

async function decryptFromSender(ciphertextB64, ivB64, encryptedKeyB64, myPrivateKey) {
  const rawAesKey = await crypto.subtle.decrypt({ name: 'RSA-OAEP' }, myPrivateKey, b642buf(encryptedKeyB64));
  const aesKey = await importAesKeyRaw(rawAesKey);
  const plaintextBuf = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: new Uint8Array(b642buf(ivB64)) }, aesKey, b642buf(ciphertextB64)
  );
  return dec.decode(plaintextBuf);
}

// ---------------- App state ----------------
let me = null;
let keyPair = null;
let activeContact = null;
let lastPoll = 0;
const publicKeyCache = new Map();
const conversationEls = new Map(); // for rendering
const presence = new Map(); // username -> { online, lastSeen }
let typingTimeout = null;
let peerTypingTimeout = null;

async function getPublicKey(username) {
  if (publicKeyCache.has(username)) return publicKeyCache.get(username);
  const r = await fetch(`${API}/api/publicKey/${encodeURIComponent(username)}`);
  if (!r.ok) return null;
  const { publicKey } = await r.json();
  const imported = await importPublicKey(publicKey);
  publicKeyCache.set(username, imported);
  return imported;
}

// ---------------- Login ----------------
document.getElementById('login-btn').onclick = login;
document.getElementById('username-input').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

async function login() {
  const errorEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errorEl.style.display = 'none';

  const name = document.getElementById('username-input').value.trim();
  if (!name) return;

  // Web Crypto's subtle API only exists in a "secure context": https://
  // or http://localhost. Opening this file directly (file://) or loading
  // it via a plain http:// LAN/IP address will not have it.
  if (!window.isSecureContext || !window.crypto || !window.crypto.subtle) {
    return showLoginError(
      'Encryption isn\'t available here. Open this app over https://, or ' +
      'http://localhost (not a plain http:// IP address or a double-clicked file) ' +
      'so the browser allows encryption.'
    );
  }

  btn.disabled = true;
  btn.textContent = 'Connecting…';
  try {
    me = name;
    keyPair = await generateRsaKeyPair();
    const publicKeyB64 = await exportPublicKey(keyPair.publicKey);

    const r = await fetch(`${API}/api/register`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: me, publicKey: publicKeyB64 })
    });
    if (!r.ok) throw new Error(`Server responded with ${r.status}`);

    document.getElementById('login').style.display = 'none';
    document.getElementById('app').classList.add('active');
    await loadPresence();
    loadContacts();
    loadStories();
    connectStream();
    setInterval(loadContacts, 5000);
    setInterval(loadPresence, 5000);
  } catch (err) {
    console.error('Login failed:', err);
    me = null;
    btn.disabled = false;
    btn.textContent = 'Enter';
    if (err instanceof TypeError) {
      // fetch() throws a generic TypeError on network failure / CORS block
      showLoginError(
        `Can't reach the server. Make sure "node server.js" is running and ` +
        `that you opened this page from that same server (e.g. http://localhost:3000), ` +
        `not by double-clicking the HTML file.`
      );
    } else {
      showLoginError(`Something went wrong: ${err.message}`);
    }
  }
}

function showLoginError(message) {
  const errorEl = document.getElementById('login-error');
  errorEl.textContent = message;
  errorEl.style.display = 'block';
}

async function loadPresence() {
  const r = await fetch(`${API}/api/presence`);
  const { presence: p } = await r.json();
  Object.entries(p).forEach(([name, info]) => presence.set(name, info));
  if (activeContact) updateHeaderStatus();
}

function formatLastSeen(ts) {
  if (!ts) return 'offline';
  const diffMin = Math.round((Date.now() - ts) / 60000);
  if (diffMin < 1) return 'last seen just now';
  if (diffMin < 60) return `last seen ${diffMin}m ago`;
  const diffHr = Math.round(diffMin / 60);
  if (diffHr < 24) return `last seen ${diffHr}h ago`;
  return `last seen ${new Date(ts).toLocaleDateString()}`;
}

// ---------------- Contacts ----------------
async function loadContacts() {
  const r = await fetch(`${API}/api/users`);
  const { users } = await r.json();
  const list = document.getElementById('contact-list');
  list.innerHTML = '';
  users.filter(u => u !== me).forEach(u => {
    const info = presence.get(u) || {};
    const div = document.createElement('div');
    div.className = 'contact' + (u === activeContact ? ' active' : '');
    div.innerHTML = `
      <div class="avatar-wrap">
        <div class="avatar">${u[0].toUpperCase()}</div>
        <div class="dot ${info.online ? 'online' : ''}"></div>
      </div>
      <div class="contact-meta">
        <div class="contact-name">${escapeHtml(u)}</div>
        <div class="contact-sub">${info.online ? 'online' : formatLastSeen(info.lastSeen)}</div>
      </div>`;
    div.onclick = () => openConversation(u);
    list.appendChild(div);
  });
}

function updateHeaderStatus() {
  const info = presence.get(activeContact) || {};
  const el = document.getElementById('chat-substatus');
  if (el.classList.contains('typing')) return; // typing indicator takes priority
  el.textContent = info.online ? 'online' : formatLastSeen(info.lastSeen);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function openConversation(user) {
  activeContact = user;
  loadContacts();
  document.getElementById('chat-title').textContent = user;
  document.getElementById('chat-substatus').classList.remove('typing');
  updateHeaderStatus();
  document.getElementById('composer').style.display = 'flex';
  const msgDiv = document.getElementById('messages');
  msgDiv.innerHTML = '';
  const r = await fetch(`${API}/api/messages?me=${encodeURIComponent(me)}&withUser=${encodeURIComponent(user)}&since=0`);
  const { messages } = await r.json();
  for (const m of messages) await renderMessage(m);
  lastPoll = Date.now();
  // Tell the sender we've read everything in this conversation
  fetch(`${API}/api/messages/read`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ me, withUser: user })
  });
}

async function renderMessage(m) {
  if (activeContact !== (m.from === me ? m.to : m.from)) return; // only render active convo
  const isMe = m.from === me;
  const plaintext = await decryptFromSender(m.ciphertext, m.iv, m.encryptedKey, keyPair.privateKey).catch(() => '[unable to decrypt]');
  const msgDiv = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'bubble-row ' + (isMe ? 'me' : 'them');
  row.dataset.msgId = m.id;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  const ticksHtml = isMe ? renderTicks(m.status) : '';
  const time = new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (m.type === 'image') {
    bubble.innerHTML = `<img src="${plaintext}" /><div class="ts">${time}${ticksHtml}</div>`;
  } else {
    bubble.innerHTML = `<div>${escapeHtml(plaintext)}</div><div class="ts">${time}${ticksHtml}</div>`;
  }
  row.appendChild(bubble);
  msgDiv.appendChild(row);
  msgDiv.scrollTop = msgDiv.scrollHeight;

  // If we're actively viewing this conversation and it's from the other person, mark it read immediately.
  if (!isMe && activeContact === m.from) {
    fetch(`${API}/api/messages/read`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ me, withUser: m.from })
    });
  }
}

// WhatsApp-style ticks: single = sent, double gray = delivered, double blue = read
function renderTicks(status) {
  if (status === 'read') return `<span class="ticks read">✓✓</span>`;
  if (status === 'delivered') return `<span class="ticks">✓✓</span>`;
  return `<span class="ticks">✓</span>`;
}

function updateMessageStatus(id, status) {
  const row = document.querySelector(`.bubble-row[data-msg-id="${id}"]`);
  if (!row) return;
  const ticksEl = row.querySelector('.ticks');
  if (!ticksEl) return;
  ticksEl.outerHTML = renderTicks(status);
}

// ---------------- Sending ----------------
document.getElementById('send-btn').onclick = sendText;
document.getElementById('text-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });
document.getElementById('image-input').addEventListener('change', sendImage);

document.getElementById('text-input').addEventListener('input', () => {
  if (!activeContact) return;
  fetch(`${API}/api/typing`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ from: me, to: activeContact, isTyping: true })
  });
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => {
    fetch(`${API}/api/typing`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ from: me, to: activeContact, isTyping: false })
    });
  }, 1500);
});

async function sendText() {
  const input = document.getElementById('text-input');
  const text = input.value.trim();
  if (!text || !activeContact) return;
  input.value = '';
  await sendPayload(text, 'text');
}

async function sendImage(e) {
  const file = e.target.files[0];
  if (!file || !activeContact) return;
  const dataUrl = await new Promise(res => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result);
    reader.readAsDataURL(file);
  });
  await sendPayload(dataUrl, 'image');
  e.target.value = '';
}

async function sendPayload(plaintext, type) {
  const recipientKey = await getPublicKey(activeContact);
  if (!recipientKey) { alert('Could not find that contact\'s public key.'); return; }
  const { ciphertext, iv, encryptedKey } = await encryptForRecipient(plaintext, recipientKey);
  await fetch(`${API}/api/messages`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ from: me, to: activeContact, ciphertext, iv, encryptedKey, type })
  });
}

// ---------------- Realtime stream ----------------
function connectStream() {
  const es = new EventSource(`${API}/api/stream?username=${encodeURIComponent(me)}`);
  es.addEventListener('message', async (e) => {
    const m = JSON.parse(e.data);
    await renderMessage(m);
  });
  es.addEventListener('story', (e) => {
    const s = JSON.parse(e.data);
    if (s.from === me || (s.encryptedKeys && s.encryptedKeys[me])) addStoryBubble(s);
  });
  es.addEventListener('presence', (e) => {
    const { username, online, lastSeen } = JSON.parse(e.data);
    presence.set(username, { online, lastSeen: lastSeen || (presence.get(username) || {}).lastSeen });
    loadContacts();
    if (activeContact === username) updateHeaderStatus();
  });
  es.addEventListener('status', (e) => {
    const data = JSON.parse(e.data);
    const ids = data.ids || (data.id ? [data.id] : []);
    ids.forEach(id => updateMessageStatus(id, data.status));
  });
  es.addEventListener('typing', (e) => {
    const { from, isTyping } = JSON.parse(e.data);
    if (activeContact !== from) return;
    const el = document.getElementById('chat-substatus');
    clearTimeout(peerTypingTimeout);
    if (isTyping) {
      el.textContent = 'typing…';
      el.classList.add('typing');
      peerTypingTimeout = setTimeout(() => { el.classList.remove('typing'); updateHeaderStatus(); }, 3000);
    } else {
      el.classList.remove('typing');
      updateHeaderStatus();
    }
  });
}

// ---------------- Stories ----------------
document.getElementById('story-close').onclick = () => document.getElementById('story-viewer').style.display = 'none';

async function loadStories() {
  const r = await fetch(`${API}/api/stories`);
  const { stories } = await r.json();
  const bar = document.getElementById('stories-bar');
  bar.innerHTML = '';

  const addBtn = document.createElement('div');
  addBtn.className = 'story-avatar';
  addBtn.innerHTML = `<div class="story-ring add">+</div><div class="story-label">Your story</div>`;
  addBtn.onclick = postStory;
  bar.appendChild(addBtn);

  stories.filter(s => s.from === me || (s.encryptedKeys && s.encryptedKeys[me]))
    .forEach(addStoryBubble);
}

function addStoryBubble(s) {
  const bar = document.getElementById('stories-bar');
  const el = document.createElement('div');
  el.className = 'story-avatar';
  el.innerHTML = `<div class="story-ring">${s.from[0].toUpperCase()}</div><div class="story-label">${escapeHtml(s.from)}</div>`;
  el.onclick = () => viewStory(s);
  bar.appendChild(el);
}

async function postStory() {
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;
    const dataUrl = await new Promise(res => {
      const reader = new FileReader();
      reader.onload = () => res(reader.result);
      reader.readAsDataURL(file);
    });
    // Encrypt once with a fresh AES key, then wrap that AES key separately
    // for every contact (including myself) with their own RSA public key.
    const r = await fetch(`${API}/api/users`);
    const { users } = await r.json();
    const aesKey = await generateAesKey();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ciphertextBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, enc.encode(dataUrl));
    const rawAesKey = await exportAesKeyRaw(aesKey);
    const encryptedKeys = {};
    for (const u of users) {
      const pub = await getPublicKey(u);
      if (!pub) continue;
      const wrapped = await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pub, rawAesKey);
      encryptedKeys[u] = buf2b64(wrapped);
    }
    await fetch(`${API}/api/stories`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        from: me, ciphertext: buf2b64(ciphertextBuf), iv: buf2b64(iv),
        encryptedKeys, mediaType: 'image'
      })
    });
    loadStories();
  };
  fileInput.click();
}

async function viewStory(s) {
  const myEncryptedKey = s.encryptedKeys ? s.encryptedKeys[me] : null;
  if (!myEncryptedKey) return;
  const plaintext = await decryptFromSender(s.ciphertext, s.iv, myEncryptedKey, keyPair.privateKey).catch(() => null);
  if (!plaintext) return;
  document.getElementById('story-img').src = plaintext;
  document.getElementById('story-caption').textContent = `${s.from} · ${new Date(s.ts).toLocaleString()}`;
  document.getElementById('story-viewer').style.display = 'flex';
}
</script>
</body>
</html>
